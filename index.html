<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Country-level water bankruptcy risk assessments for journalists, investors, and policymakers. Sourced from NASA, FAO, WRI, and BIS data.">
  <title>Water Scarcity Intelligence Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====================================================
       LOADING STATE
  ===================================================== -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-label">Connecting to intelligence database…</div>
  </div>

  <!-- ====================================================
       ERROR STATE
  ===================================================== -->
  <div id="error-state" hidden>
    <div class="error-icon">&#9888;</div>
    <div class="error-heading">Unable to load assessment</div>
    <div class="error-body">An error occurred.</div>
  </div>

  <!-- ====================================================
       APPLICATION SHELL
  ===================================================== -->
  <div id="app" hidden>

    <!-- Header -->
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/">
          <div class="brand-mark">W</div>
          <div class="brand-text">
            <div class="brand-name">Water Scarcity Intelligence</div>
            <div class="brand-sub">Risk Assessment Platform</div>
          </div>
        </a>

        <!-- Country selector — shown by JS once countries are loaded -->
        <div id="selector-wrap">
          <span class="selector-label">Country</span>
          <select id="country-select" aria-label="Select country assessment"></select>
        </div>
      </div>
    </header>

    <!-- Dynamic country content injected here by app.js -->
    <main id="country-content"></main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-credit">
          Water Scarcity Intelligence Project &middot; 2026
        </div>
        <div class="footer-links">
          <a href="#methodology">Methodology</a>
          <a href="#about">About</a>
        </div>
      </div>
    </footer>

  </div><!-- /#app -->

  <!-- Supabase credentials (user fills in after setup) -->
  <script src="config.js"></script>
  <!-- Application rendering engine -->
  <script src="app.js"></script>

</body>
</html>
